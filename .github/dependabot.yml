version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 1 # Wait for one day after release before updating a dependency

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 1 # Wait for one day after release before updating a dependency
    groups:
      amsterdam-design-system:
        applies-to: 'version-updates'
        patterns:
          - '@amsterdam/design-system-*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'

      patch-and-minor-dependencies:
        applies-to: 'version-updates'
        exclude-patterns:
          - '@amsterdam/design-system-*'
          - '@hey-api/openapi-ts'
        update-types:
          - 'patch'
          - 'minor'

    versioning-strategy: 'increase-if-necessary'
    open-pull-requests-limit: 20

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 1

    groups:
      node-updates:
        patterns:
          - 'node'
        update-types:
          - 'minor'
          - 'patch'

      nginx-stable-patches:
        patterns:
          - 'nginx'
        update-types:
          - 'patch'

    versioning-strategy: 'increase-if-necessary'
