name: PR label
on:
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-label:
    runs-on: ubuntu-latest
    steps:
      - uses: Amsterdam/aapp_pr_label@2c0b4305c36394794a8c79671079da31fba48846
        with:
          code-reviewed-color: "#99f490"
          code-reviewed-enabled: true
          code-reviewed-label: "Code reviewed"
          copilot-logins: |
            github-copilot[bot]
          copilot-ready-color: "#05b103"
          copilot-ready-enabled: true
          copilot-ready-label: "Copilot ready"
          labels: |
            "^apps/([^/]+)/":
                name: "app: $1"
                color: '#0366d6'
            "^libs/([^/]+)/":
                name: "lib: $1"
                color: '#0366d6'
            "^(?:pipelines/|\\.github/(?:workflows|actions)/)":
                name: 'pipelines'
                color: '#0366d6'
                description: 'Pipeline related'
          pr-description-copilot-section-after: "## Why"
          pr-description-copilot-section-before: "## What"
          pr-description-update-enabled: true
          reviewer-usernames: |
            frankfe-amsterdam
            kyunwang
            alimpens
